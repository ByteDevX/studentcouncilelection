services:
  laravel-app:
    build: .
    ports:
      - "50002:50002"
    volumes:
      - /srv/webhost/studentcouncilelection/www:/var/www
    networks:
      - link0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  link0:
    external: true
