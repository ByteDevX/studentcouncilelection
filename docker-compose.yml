services:
  sce:
    build: .
    ports:
      - "50002:50002"
    networks:
      - link0
    container_name: sce
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  link0:
    external: true
