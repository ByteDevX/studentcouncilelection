services:
  sce-app:
    # Build from the Dockerfile above (Portainer will run `docker build`)
    build:
      context: .
      dockerfile: Dockerfile

    # Optionally push image to a registry for reuse
    # image: ghcr.io/<your-org>/laravel-app:latest

    restart: always
    container_name: sce-app

    # -----------------------------------------------------------------
    # Environment – adapt to **your existing DB / cache / SMTP** setup
    # -----------------------------------------------------------------
    environment:
      APP_ENV:           production
      APP_DEBUG:         "false"
      LOG_CHANNEL:       stderr
      APP_KEY:           ${APP_KEY:-base64:tncjk6Htau/rVmmx9lc8MMJ8mqjLhOVYqjBaSoyvzwg=}          # supply via Portainer “Env vars” or Secrets

      # Database → point to your external service
      DB_CONNECTION:     mysql
      DB_HOST:           ${DB_HOST:-db2.kevinchr.com} # hostname on the shared Docker network
      DB_PORT:           ${DB_PORT:-3306}
      DB_DATABASE:       ${DB_DATABASE:-studentcouncilelection}
      DB_USERNAME:       ${DB_USERNAME:-studentcouncilelection}
      DB_PASSWORD:       ${DB_PASSWORD:-ACCESS!def00}

    # Persist user uploads, logs, etc.
    volumes:
      - storage:/var/www/storage
      - .:/var/www:ro

    # -----------------------------------------------------------------
    # Networks
    # -----------------------------------------------------------------
    # 1. “app-net” is local to this stack (optional).
    # 2. “proxy” is an **external** network already used by your reverse-proxy.
    networks:
      - sce-net
      - link0
    ports:
      - "9000:9000"

    # Expose PHP-FPM for the proxy (ONLY on the internal networks)
    expose:
      - "9000"

  sce-web:
    image: nginx:1.26-alpine
    depends_on:
      - sce-app
    restart: always
    container_name: sce-web

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro                     # code + /public
      - storage:/var/www/storage          # same uploads

    expose:
      - "80"                              # HTTP for NPM

    networks:
      - sce-net                           # to reach sce:9000
      - link0                             # external network NPM uses

volumes:
  storage:

networks:
  sce-net:
  link0:
    external: true
