server {
    listen 80;
    server_name _;          # NPM terminates TLS & handles host names
    root /var/www/public;
    index index.php index.html;

    # Static assets
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # All other routes → Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP → FastCGI (sce:9000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass sce-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
